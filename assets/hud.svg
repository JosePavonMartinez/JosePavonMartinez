<svg width="900" height="290" viewBox="0 0 900 290"
     xmlns="http://www.w3.org/2000/svg">

<style>
  .mono {
    font-family: "SFMono-Regular", "Cascadia Code",
                 "Roboto Mono", Menlo, monospace;
  }

  .label {
    fill:#565f89;
    font-size:12px;
    letter-spacing:2px;
  }

  .value {
    fill:#c0caf5;
    font-size:14px;
  }

  .green { fill:#9ece6a; }
  .purple { fill:#bb9af7; }
  .cyan { fill:#7dcfff; }
  .yellow { fill:#e0af68; }

  .xp {
    animation: xp 3s ease-out forwards;
    transform-origin:left;
  }

  @keyframes xp {
    from { transform:scaleX(0); }
    to { transform:scaleX(1); }
  }

  .quest1 {
    animation: quest .4s .5s both;
  }

  .quest2 {
    animation: quest .4s 1s both;
  }

  .quest3 {
    animation: quest .4s 1.5s both;
  }

  @keyframes quest {
    from {
      opacity:0;
      transform:translateX(-5px);
    }
    to {
      opacity:1;
      transform:translateX(0);
    }
  }

  .blink {
    animation: blink 1.2s step-end infinite;
  }

  @keyframes blink {
    50% { opacity:.25; }
  }
</style>

<!-- PLAYER CARD -->

<rect x="10" y="10" width="430" height="270"
      rx="12" fill="#16161e" stroke="#414868"/>

<path d="M10 55H440"
      stroke="#292e42"/>

<text x="30" y="39"
      class="mono purple"
      font-size="15"
      font-weight="bold">
  PLAYER_01
</text>

<text x="415" y="39"
      text-anchor="end"
      class="mono green"
      font-size="11">
  ● ONLINE
</text>

<text x="30" y="88" class="mono label">
  NAME
</text>

<text x="150" y="88" class="mono value">
  JOSE
</text>

<text x="30" y="118" class="mono label">
  CLASS
</text>

<text x="150" y="118" class="mono cyan">
  SOFTWARE ENGINEER
</text>

<text x="30" y="148" class="mono label">
  ALIGNMENT
</text>

<text x="150" y="148" class="mono yellow">
  CHAOTIC GOOD
</text>

<text x="30" y="178" class="mono label">
  STATUS
</text>

<text x="150" y="178" class="mono green">
  SHIPPING
</text>

<text x="30" y="208" class="mono label">
  EDITOR
</text>

<text x="150" y="208" class="mono value">
  probably AI at this point
</text>

<text x="30" y="244"
      class="mono label">
  XP
</text>

<rect x="70" y="232" width="330" height="14"
      rx="3" fill="#292e42"/>

<rect class="xp"
      x="70" y="232"
      width="270" height="14"
      rx="3"
      fill="#bb9af7"/>


<!-- QUEST CARD -->

<rect x="460" y="10" width="430" height="270"
      rx="12" fill="#16161e" stroke="#414868"/>

<path d="M460 55H890"
      stroke="#292e42"/>

<text x="480" y="39"
      class="mono yellow"
      font-size="15"
      font-weight="bold">
  CURRENT_QUEST
</text>

<text x="865" y="39"
      text-anchor="end"
      class="mono"
      font-size="11"
      fill="#565f89">
  02 / 03
</text>


<g class="quest1">
  <text x="485" y="95"
        class="mono green"
        font-size="17">
    ✓
  </text>

  <text x="515" y="95"
        class="mono value">
    Build cool shit
  </text>
</g>


<g class="quest2">
  <text x="485" y="135"
        class="mono green"
        font-size="17">
    ✓
  </text>

  <text x="515" y="135"
        class="mono value">
    Automate boring shit
  </text>
</g>


<g class="quest3">
  <text x="485" y="175"
        class="mono yellow blink"
        font-size="17">
    □
  </text>

  <text x="515" y="175"
        class="mono value">
    Don't break production
  </text>
</g>


<line x1="485" y1="205"
      x2="865" y2="205"
      stroke="#292e42"/>

<text x="485" y="238"
      class="mono label">
  REWARD
</text>

<text x="575" y="238"
      class="mono yellow">
  +500 XP
</text>

<text x="865" y="238"
      text-anchor="end"
      class="mono"
      font-size="11"
      fill="#565f89">
  IN PROGRESS...
</text>

</svg>
