<svg width="900" height="220" viewBox="0 0 900 220"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="neon" x1="0" x2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4"
             patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity=".025"/>
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: "SFMono-Regular", "Cascadia Code",
                   "Roboto Mono", Menlo, monospace;
    }

    .name {
      font-size: 50px;
      font-weight: 800;
      letter-spacing: 9px;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 5px;
      fill: #7dcfff;
    }

    .online {
      font-size: 12px;
      letter-spacing: 2px;
      fill: #9ece6a;
      animation: pulse 2s ease-in-out infinite;
    }

    .glitch-a {
      animation: glitchA 8s infinite;
    }

    .glitch-b {
      animation: glitchB 8s infinite;
    }

    .grid {
      animation: gridMove 8s linear infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:.45; }
      50% { opacity:1; }
    }

    @keyframes glitchA {
      0%, 89%, 93%, 100% {
        transform: translate(0);
        opacity: 0;
      }
      90% {
        transform: translate(-4px, 1px);
        opacity: .65;
      }
      91% {
        transform: translate(5px, -1px);
        opacity: .45;
      }
      92% {
        transform: translate(-2px);
        opacity: .6;
      }
    }

    @keyframes glitchB {
      0%, 89%, 93%, 100% {
        transform: translate(0);
        opacity: 0;
      }
      90% {
        transform: translate(5px, -1px);
        opacity: .5;
      }
      91% {
        transform: translate(-6px, 1px);
        opacity: .7;
      }
      92% {
        transform: translate(3px);
        opacity: .45;
      }
    }

    @keyframes gridMove {
      from { transform: translateY(0); }
      to { transform: translateY(20px); }
    }
  </style>

  <!-- background -->
  <rect x="10" y="10" width="880" height="200"
        rx="14" fill="#11121c" stroke="#414868"/>

  <!-- subtle horizon grid -->
  <g opacity=".12" stroke="#bb9af7" class="grid">
    <line x1="0" y1="170" x2="900" y2="170"/>
    <line x1="0" y1="185" x2="900" y2="185"/>
    <line x1="0" y1="200" x2="900" y2="200"/>

    <line x1="200" y1="150" x2="170" y2="220"/>
    <line x1="300" y1="150" x2="285" y2="220"/>
    <line x1="400" y1="150" x2="395" y2="220"/>
    <line x1="500" y1="150" x2="505" y2="220"/>
    <line x1="600" y1="150" x2="615" y2="220"/>
    <line x1="700" y1="150" x2="730" y2="220"/>
  </g>

  <!-- decorative corners -->
  <path d="M30 48V30H48"
        fill="none" stroke="#7aa2f7" opacity=".8"/>
  <path d="M852 30H870V48"
        fill="none" stroke="#ff79c6" opacity=".8"/>

  <text x="40" y="53" class="mono online">
    ● SYSTEM ONLINE
  </text>

  <text x="860" y="53"
        text-anchor="end"
        class="mono"
        font-size="11"
        fill="#565f89">
    BUILD 0xC0FFEE
  </text>

  <!-- glitch shadows -->
  <text x="450" y="120"
        text-anchor="middle"
        class="mono name glitch-a"
        fill="#2ac3de">
    CHEMA.EXE
  </text>

  <text x="450" y="120"
        text-anchor="middle"
        class="mono name glitch-b"
        fill="#ff79c6">
    CHEMA.EXE
  </text>

  <!-- main -->
  <text x="450" y="120"
        text-anchor="middle"
        class="mono name"
        fill="url(#neon)"
        filter="url(#glow)">
    CHEMA.EXE
  </text>

  <text x="450" y="155"
        text-anchor="middle"
        class="mono subtitle">
    SOFTWARE ENGINEER // SYSTEMS // WEB // AI
  </text>

  <text x="450" y="184"
        text-anchor="middle"
        class="mono"
        font-size="11"
        fill="#565f89">
    [ press any key to continue ]
  </text>

  <!-- CRT -->
  <rect x="10" y="10" width="880" height="200"
        rx="14" fill="url(#scanlines)" pointer-events="none"/>
</svg>
